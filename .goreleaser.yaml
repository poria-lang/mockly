# GoReleaser configuration for Mockly
# Automates multi-OS binary builds, SHA-256 checksums, and GitHub release creation
version: 2

project_name: mockly

before:
  hooks:
    - go mod tidy

builds:
  - id: mockly
    main: ./cmd/mockly
    binary: mockly
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    goarm:
      - 8
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X github.com/poria-lang/mockly/internal/version.Version={{ .Version }}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: voyyar
    name: mockly
  prerelease: auto
  draft: false
  make_latest: true